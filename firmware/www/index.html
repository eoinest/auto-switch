<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <title>Auto Switch</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main aria-label="Auto Switch">
    <section id="connect" hidden>
      <form id="connect-form">
        <label for="token">Device key</label>
        <input id="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required minlength="16">
        <button type="submit">Connect</button>
      </form>
    </section>
    <section id="device" hidden aria-label="Switch controls">
      <div id="mode-panel" hidden>
        <div class="segmented" role="group" aria-label="Mode">
          <button id="mode-demo" aria-pressed="false">Demo</button>
          <button id="mode-daily" aria-pressed="false">Check-in</button>
        </div>
        <div class="interval-row">
          <label for="interval">Check interval</label>
          <select id="interval">
            <option value="30">30 seconds</option>
            <option value="60" selected>1 minute</option>
            <option value="300">5 minutes</option>
            <option value="900">15 minutes</option>
          </select>
        </div>
      </div>
      <div id="channels"></div>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <template id="channel-template">
    <div class="channel">
      <div class="controls" role="group" aria-label="Switch">
        <button data-state="on">On</button>
        <button data-state="off">Off</button>
      </div>
      <p class="channel-note"></p>
    </div>
  </template>
</body>
</html>
