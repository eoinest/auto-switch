<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2083" viewBox="0 0 1800 2083" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Auto Switch — complete external wiring sheet</title>
<desc id="diagram-desc">Functional circuit panels with named electrical nets, Pico physical pad assignments, all passive components, and an automatically generated exhaustive terminal schedule from harness.json. Matching net names mean connected wires. Pico internal USB power path is shown separately in power-map.svg.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#233942}.title{font-size:34px;font-weight:700;letter-spacing:-.7px}.subtitle{font-size:19px;fill:#53636b}.name{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#53636b}.micro{font-size:14px;fill:#53636b}.net{font-size:17px;font-weight:700;letter-spacing:.3px}.mono{font-family:monospace;font-size:16px}.wire{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.signal{stroke-dasharray:8 6;stroke-width:3}.is-off{opacity:.2} .component{cursor:pointer} .section{font-size:17px;font-weight:700;letter-spacing:1.4px;fill:#53636b}
</style>
<rect width="1800" height="2083" fill="#f7f6f0"/>
<text x="40" y="55" class="title">Auto Switch · complete connection sheet</text>
<text x="40" y="87" class="subtitle">Revision 3 electrical nets · direct-solder Pico preferred · exact per-hole prototype-board routing is not supplied</text>
<rect x="40" y="110" width="1720" height="67" rx="14" fill="#eaf1f1" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="60" y="138" class="body">HOW TO READ THIS SHEET   Same net name = the same connected wire, wherever it appears.</text>
<text x="60" y="163" class="small">Solid lines carry supply/return; blue dashes carry signals. A filled dot is a junction. No crossing wires imply a connection.</text>
<text x="40" y="216" class="section">A   SOURCE AND PICO SUPPLY</text>
<g data-part="BAT" class="component">
<rect x="40" y="237" width="260" height="145" rx="14" fill="#fff4df" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="58" y="269" class="name">BAT · 4 × AA NiMH</text>
<text x="58" y="298" class="body">Pololu 1153 holder</text>
<text x="58" y="323" class="body">Red → F1 input</text>
<text x="58" y="348" class="body">Black → GND</text>
</g>
<g data-part="F1" class="component">
<rect x="360" y="237" width="285" height="145" rx="14" fill="#fff4df" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="378" y="269" class="name">F1 + disconnect</text>
<text x="378" y="298" class="body">01500274Z fuse holder</text>
<text x="378" y="323" class="body">0001.2507 · 2 A time-delay</text>
<text x="378" y="348" class="body">JST RCY 2180 + 2181</text>
</g>
<g data-part="MASTER" class="component">
<rect x="705" y="237" width="295" height="145" rx="14" fill="#fff4df" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="723" y="269" class="name">MASTER · Pololu 2810</text>
<text x="723" y="298" class="body">VIN ← FUSED_BAT</text>
<text x="723" y="323" class="body">VOUT → PACK_SW</text>
<text x="723" y="348" class="body">GND → GND · ON unused</text>
</g>
<g data-part="REG" class="component">
<rect x="1060" y="237" width="310" height="145" rx="14" fill="#ffece4" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="1078" y="269" class="name">REG · Pololu 2574</text>
<text x="1078" y="298" class="body">VIN ← PACK_SW</text>
<text x="1078" y="323" class="body">VOUT → 5V · GND → GND</text>
<text x="1078" y="348" class="body">ENABLE left unconnected</text>
</g>
<path d="M300 308H360" class="wire" stroke="#ad5c12" marker-end="url(#arrow)"/>
<path d="M645 308H705" class="wire" stroke="#ad5c12" marker-end="url(#arrow)"/>
<path d="M1000 308H1060" class="wire" stroke="#ad5c12" marker-end="url(#arrow)"/>
<path d="M1370 308H1410" class="wire" stroke="#ba421f" marker-end="url(#arrow)"/>
<g data-part="D1" class="component">
<rect x="1410" y="237" width="350" height="145" rx="14" fill="#ffece4" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="1428" y="269" class="name">D1 · 1N5819</text>
<text x="1428" y="298" class="body">Anode ← 5V</text>
<text x="1428" y="323" class="body">Striped cathode → VSYS</text>
<text x="1428" y="348" class="body">VSYS → Pico pad 39</text>
</g>
<text x="40" y="412" class="small">BAT_POS: holder + to fuse. FUSED_BAT passes through RCY to master VIN. RCY also disconnects the GND lead.</text>
<text x="40" y="437" class="small">Pico USB/VBUS and its onboard diode are separate from D1. See power-map.svg for the complete internal power path.</text>
<text x="40" y="485" class="section">B   CONTROLLER PADS</text>
<g data-part="PICO" class="component">
<rect x="40" y="506" width="505" height="339" rx="14" fill="#edf5ef" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="58" y="538" class="name">PICO W / PICO 2 W</text>
<text x="58" y="567" class="body">39 · VSYS ← D1 cathode</text>
<text x="58" y="592" class="body">38 · GND → common GND</text>
<text x="58" y="617" class="body">20 · GP15 → SERVO_ENABLE (gate ON)</text>
<text x="58" y="642" class="body">21 · GP16 → PWM0_RAW → R_PWM0</text>
<text x="58" y="667" class="body">22 · GP17 → PWM1_RAW → R_PWM1</text>
<text x="58" y="692" class="body">31 · GP26 / ADC0 ← ADC</text>
<text x="58" y="717" class="body">40 · VBUS: no external wire</text>
<text x="58" y="742" class="body">36 · 3V3 OUT: no external wire</text>
</g>
<text x="59" y="826" class="small">Numbers identify pads even without soldered headers.</text>
<text x="590" y="485" class="section">C   MOTOR POWER AND LOGIC</text>
<g data-part="GATE" class="component">
<rect x="590" y="506" width="410" height="158" rx="14" fill="#ffece4" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="608" y="538" class="name">GATE · Pololu 2810 LV</text>
<text x="608" y="567" class="body">VIN ← 5V · VOUT → SERVO_5V</text>
<text x="608" y="592" class="body">ON ← SERVO_ENABLE · GND → GND</text>
<text x="608" y="617" class="body">Keep physical slider OFF.</text>
<text x="608" y="642" class="body">GP15 is 3.3 V logic, not motor power.</text>
</g>
<g data-part="SERVO0" class="component">
<rect x="1055" y="506" width="335" height="158" rx="14" fill="#fff" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="1073" y="538" class="name">SERVO0 · MG90S</text>
<text x="1073" y="567" class="body">Power ← SERVO_5V</text>
<text x="1073" y="592" class="body">Ground → GND</text>
<text x="1073" y="617" class="body">Signal ← PWM0</text>
<text x="1073" y="642" class="body">Use original servo mating plug.</text>
</g>
<g data-part="SERVO1" class="component">
<rect x="1430" y="506" width="330" height="158" rx="14" fill="#fff" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="1448" y="538" class="name">SERVO1 · MG90S</text>
<text x="1448" y="567" class="body">Power ← SERVO_5V</text>
<text x="1448" y="592" class="body">Ground → GND</text>
<text x="1448" y="617" class="body">Signal ← PWM1</text>
<text x="1448" y="642" class="body">Omit for one-gang version.</text>
</g>
<path d="M1000 577H1055" class="wire" stroke="#ba421f" marker-end="url(#arrow)"/>
<text x="1008" y="486" class="net" style="fill:#ba421f">SERVO_5V</text>
<text x="590" y="704" class="net" style="fill:#176e99">PWM0_RAW</text>
<path d="M725 698H760" class="wire signal" stroke="#176e99"/>
<path d="M760 698h15m52 0h15" class="wire" stroke="#176e99"/>
<rect x="775" y="689" width="52" height="18" rx="0" fill="#fff" stroke="#176e99" stroke-width="1.5"/>
<text x="763" y="673" class="net">R_PWM0</text>
<text x="767" y="736" class="small">1 kΩ</text>
<path d="M842 698H973" class="wire signal" stroke="#176e99" marker-end="url(#arrow)"/>
<text x="899" y="681" class="net" style="fill:#176e99">PWM0</text>
<text x="1080" y="704" class="net" style="fill:#176e99">PWM1_RAW</text>
<path d="M1215 698H1250" class="wire signal" stroke="#176e99"/>
<path d="M1250 698h15m52 0h15" class="wire" stroke="#176e99"/>
<rect x="1265" y="689" width="52" height="18" rx="0" fill="#fff" stroke="#176e99" stroke-width="1.5"/>
<text x="1253" y="673" class="net">R_PWM1</text>
<text x="1257" y="736" class="small">1 kΩ</text>
<path d="M1332 698H1463" class="wire signal" stroke="#176e99" marker-end="url(#arrow)"/>
<text x="1390" y="681" class="net" style="fill:#176e99">PWM1</text>
<text x="590" y="791" class="body">Each servo has its own signal; both share power and ground.</text>
<text x="590" y="819" class="small">Run motor + and return on direct power wiring. A Pico GPIO carries only the control signal.</text>
<text x="40" y="890" class="section">D   PASSIVES · ADD ALL OF THESE TO THE NAMED NETS</text>
<rect x="40" y="912" width="325" height="351" rx="14" fill="#fff" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="60" y="945" class="name">C1 · supply buffer</text>
<text x="60" y="973" class="body">470 µF / 10 V</text>
<text x="95" y="1014" class="net" style="fill:#ba421f">5V</text>
<path d="M125 1030V1080" class="wire" stroke="#ba421f"/>
<path d="M99 1080H151M99 1094H151" class="wire" stroke="#ba421f"/>
<text x="159" y="1076" class="name">+</text>
<text x="159" y="1111" class="small">− stripe</text>
<path d="M125 1094V1175" class="wire" stroke="#344858"/>
<path d="M125 1175v12m-15 0h30m-24 7h18m-12 7h6" class="wire" stroke="#344858"/>
<text x="60" y="1231" class="small">Close to gate VIN and GND.</text>
<rect x="385" y="912" width="335" height="351" rx="14" fill="#fff" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="405" y="945" class="name">R_EN · default off</text>
<text x="405" y="981" class="net" style="fill:#176e99">SERVO_ENABLE</text>
<path d="M440 1000v15m0 42v15" class="wire" stroke="#176e99"/>
<rect x="432" y="1015" width="16" height="42" rx="0" fill="#fff" stroke="#176e99" stroke-width="1.5"/>
<text x="459" y="1032" class="net">R_EN</text>
<text x="459" y="1055" class="small">100 kΩ</text>
<path d="M440 1072V1175" class="wire" stroke="#344858"/>
<path d="M440 1175v12m-15 0h30m-24 7h18m-12 7h6" class="wire" stroke="#344858"/>
<text x="405" y="1209" class="small">Pull gate ON toward GND</text>
<text x="405" y="1231" class="small">while GPIO is not driving it.</text>
<rect x="740" y="912" width="510" height="351" rx="14" fill="#fff" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="760" y="945" class="name">D2 + R_BLEED · shutoff</text>
<text x="760" y="982" class="net" style="fill:#ba421f">SERVO_5V</text>
<path d="M790 1002H1070" class="wire" stroke="#ba421f"/>
<circle cx="850" cy="1002" r="6" fill="#ba421f"/>
<circle cx="1070" cy="1002" r="6" fill="#ba421f"/>
<path d="M850 1002V1040" class="wire" stroke="#ba421f"/>
<g transform="translate(850 1112) rotate(-90)"><path d="M0 0H20M50 0H72M20 -14L46 0L20 14Z M48 -15V15" fill="white" stroke="#ba421f" stroke-width="3"/></g>
<text x="874" y="1047" class="net">D2</text>
<text x="874" y="1074" class="small">1N5819</text>
<text x="874" y="1101" class="small">stripe ↑</text>
<path d="M1070 1002v15m0 42v15" class="wire" stroke="#ba421f"/>
<rect x="1062" y="1017" width="16" height="42" rx="0" fill="#fff" stroke="#ba421f" stroke-width="1.5"/>
<text x="1089" y="1034" class="net">R_BLEED</text>
<text x="1089" y="1057" class="small">1 kΩ, ¼ W</text>
<path d="M850 1112V1175H1070V1074" class="wire" stroke="#344858"/>
<path d="M965 1175v12m-15 0h30m-24 7h18m-12 7h6" class="wire" stroke="#344858"/>
<text x="760" y="1210" class="small">D2: anode at GND, cathode at servo +.</text>
<text x="760" y="1233" class="small">Bleeder discharges the switched rail.</text>
<rect x="1270" y="912" width="490" height="351" rx="14" fill="#fff" stroke="#b5c5c9" stroke-width="1.5"/>
<text x="1290" y="945" class="name">Battery divider + filter</text>
<text x="1290" y="978" class="net" style="fill:#ad5c12">PACK_SW</text>
<path d="M1320 989v15m0 42v15" class="wire" stroke="#137b7d"/>
