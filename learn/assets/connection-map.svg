<text x="40" y="1970" class="small">LEFT UNCONNECTED: PICO.pin40_VBUS, PICO.pin36_3V3_OUT, MASTER.ON, REG.ENABLE</text>
<text x="40" y="1998" class="small">ONE-GANG BUILD: omit SERVO1 and R_PWM1. Only one motor moves at a time in firmware.</text>
<text x="40" y="2026" class="small">Bench verification required: net continuity, polarity, regulated voltage, startup droop and actual servo current.</text>
<text x="40" y="2054" class="small">Sources: Raspberry Pi Pico W datasheet §§3.4–3.5; Pololu 2810 and 2574 documentation; docs/wiring.md.</text>
