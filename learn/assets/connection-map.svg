<text x="1469" y="1136" class="small">100 nF</text>
<text x="1290" y="1210" class="small">V_ADC = V_PACK_SW × 47 / 147</text>
<text x="1290" y="1233" class="small">At 4.8 V nominal: about 1.53 V.</text>
<text x="40" y="1308" class="section">E   COMPLETE TERMINAL SCHEDULE · GENERATED FROM hardware/wiring/harness.json</text>
<text x="40" y="1340" class="small">Use board silkscreen for the real pad layout. These are electrical connections, not cable colors or physical positions.</text>
